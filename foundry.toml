[profile.default]
solc = "0.8.30"
evm_version = "prague"
src = "src"
script = "script"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./test"}, { access = "read", path = "./out"}]
bytecode_hash = "none"
cbor_metadata = false

[fmt]
bracket_spacing = true
int_types = "long"
line_length = 119
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[etherscan]
bepolia = {key = "verifyContract", url = "https://api.routescan.io/v2/network/testnet/evm/80069/etherscan", chain = 80069}
berachain = {key = "verifyContract", url = "https://api.routescan.io/v2/network/mainnet/evm/80094/etherscan", chain = 80094}

[rpc_endpoints]
bepolia = "https://bepolia.rpc.berachain.com/"
berachain = "https://rpc.berachain.com"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
